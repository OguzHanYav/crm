# nginx vor Asterisk: terminiert TLS (Let's Encrypt) auf Port 443 und reicht die
# WebSocket-Verbindung an Asterisk (127.0.0.1:8088/ws) weiter.
# Vorteil gegenüber Asterisk-TLS auf 8089: Port 443 ist auch in restriktiven
# Firmen-/Hotel-Netzen offen, und certbot erneuert das Zertifikat automatisch.
#
# Installation (Ubuntu):  apt install nginx certbot python3-certbot-nginx
#   cp nginx-pbx.conf /etc/nginx/sites-available/pbx && ln -s ../sites-available/pbx /etc/nginx/sites-enabled/
#   certbot --nginx -d pbx.example.de
# "pbx.example.de" überall durch die eigene Subdomain ersetzen.

server {
    listen 80;
    server_name pbx.example.de;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pbx.example.de;

    ssl_certificate     /etc/letsencrypt/live/pbx.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pbx.example.de/privkey.pem;

    location = /ws {
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SIP-over-WebSocket ist eine Dauerverbindung — Standard-Timeout (60 s) wäre zu kurz.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Alles andere (inkl. Asterisk-HTTP-Statusseiten) nicht nach außen geben.
    location / { return 404; }
}
